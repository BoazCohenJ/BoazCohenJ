ll="#fde68a">CH2 500mV/div</text><text x="378" y="46" text-anchor="end" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" fill="#8fb5a6">10ms/div</text><circle cx="372" cy="174" r="3" fill="#ff4d4d" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" begin="0.00s" repeatCount="indefinite"/></circle><rect x="20" y="198" width="380" height="58" rx="8" fill="none" stroke="#d9a441" stroke-opacity=".5" stroke-dasharray="5 4"/><text x="34" y="217" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.5" fill="#d9a441">WORKED EXAMPLE · R1 = 1k, C1 = 100nF</text><text x="34" y="239" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e9f1ec">τ = 100 µs   f_c = 1/(2πRC) ≈ 1.59 kHz</text></g><text x="446" y="38" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">OHM</text><text x="446" y="58" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">V = I·R</text><text x="670" y="38" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">POWER</text><text x="670" y="58" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">P = V·I</text><text x="446" y="80" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">RC TIME CONSTANT</text><text x="446" y="100" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">τ = R·C</text><text x="670" y="80" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">RC CUTOFF</text><text x="670" y="100" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">f_c = 1/(2πRC)</text><text x="446" y="122" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">VOLTAGE DIVIDER</text><text x="446" y="142" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">Vout = Vin·R2/(R1+R2)</text><text x="670" y="122" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">ADC STEP (ESP32, 12-bit)</text><text x="670" y="142" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">LSB = Vref/2ⁿ ≈ 0.8 mV</text><text x="446" y="164" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">NYQUIST</text><text x="446" y="184" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">f_s ≥ 2·f_max</text><text x="670" y="164" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">FOURIER</text><text x="670" y="184" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">f(t) = Σ aₙ sin(nωt)</text><text x="446" y="206" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">NEWTON</text><text x="446" y="226" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">F = m·a</text><text x="670" y="206" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">MAXWELL</text><text x="670" y="226" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">∇·E = ρ/ε₀</text><text x="446" y="248" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">SCHRÖDINGER</text><text x="446" y="268" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">iħ ∂ψ/∂t = Ĥψ</text><text x="670" y="248" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2" fill="#d9a441">EULER</text><text x="670" y="268" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e9f1ec">e^(iπ) + 1 = 0</text><path d="M430,16 V262" fill="none" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/></g><g transform="translate(0 340)"><circle cx="30" cy="50" r="11" fill="none" stroke="#d9a441" stroke-width="3"/><circle cx="30" cy="50" r="6" fill="#020a07"/><circle cx="870" cy="50" r="11" fill="none" stroke="#d9a441" stroke-width="3"/><circle cx="870" cy="50" r="6" fill="#020a07"/><path d="M66,40 H220" fill="none" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><path d="M680,40 H834" fill="none" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="66" cy="40" r="4" fill="#d9a441"/><circle cx="66" cy="40" r="1.8" fill="#06160f"/><circle cx="834" cy="40" r="4" fill="#d9a441"/><circle cx="834" cy="40" r="1.8" fill="#06160f"/><circle r="2.5" fill="#fff1a8" filter="url(#glow)" opacity="0"><animateMotion dur="3s" begin="0.20s" repeatCount="indefinite" path="M66,40 H220"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="0.20s" repeatCount="indefinite"/></circle><circle r="2.5" fill="#fff1a8" filter="url(#glow)" opacity="0"><animateMotion dur="3.4s" begin="1.00s" repeatCount="indefinite" path="M834,40 H680"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.4s" begin="1.00s" repeatCount="indefinite"/></circle><text x="450" y="45" text-anchor="middle" font-family="Consolas, 'S